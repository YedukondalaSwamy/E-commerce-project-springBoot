version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: jt_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: jt_user
      MYSQL_PASSWORD: jt_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: springboot-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/jt_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: yourpassword
    command: >
      java -jar
      -Dspring.datasource.url=jdbc:mysql://db:3306/jt_db
      -Dspring.datasource.username=jt_user
      -Dspring.datasource.password=jt_pass
      app.jar

volumes:
  mysql_data:
